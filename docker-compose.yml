name: nimbusflow

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set a strong local password}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [nimbusflow]

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      SQL_SERVER: sql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      EMULATOR_HTTP_PORT: 5300
      SQL_WAIT_INTERVAL: 15
    volumes:
      - ./infra/local/servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    depends_on:
      sql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5300/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      nimbusflow:
        aliases: [servicebus-emulator]

  api:
    build:
      context: .
      dockerfile: src/NimbusFlow.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__NimbusFlow: Server=sql,1433;Database=NimbusFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ServiceBus__ConnectionString: Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      ServiceBus__QueueName: workflow-jobs
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"
    depends_on:
      sql:
        condition: service_healthy
      servicebus:
        condition: service_healthy
    restart: unless-stopped
    networks: [nimbusflow]

  worker:
    build:
      context: .
      dockerfile: src/NimbusFlow.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__NimbusFlow: Server=sql,1433;Database=NimbusFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      ServiceBus__ConnectionString: Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      ServiceBus__QueueName: workflow-jobs
      WorkflowExecution__StepDelayMilliseconds: 750
      WorkflowExecution__RetryBaseDelaySeconds: 5
      WorkflowExecution__ExecutionLeaseSeconds: 900
    depends_on:
      sql:
        condition: service_healthy
      servicebus:
        condition: service_healthy
    restart: unless-stopped
    networks: [nimbusflow]

volumes:
  sql-data:

networks:
  nimbusflow:
    driver: bridge
