version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /src/NimbusFlow.Api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /src/NimbusFlow.Worker
    schedule:
      interval: weekly
