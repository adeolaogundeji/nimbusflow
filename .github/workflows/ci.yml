name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, test, and inspect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Restore locked dependencies
        run: dotnet restore NimbusFlow.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format NimbusFlow.slnx --no-restore --verify-no-changes

      - name: Build with analyzers
        run: dotnet build NimbusFlow.slnx --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test NimbusFlow.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

      - name: Audit NuGet dependencies
        run: dotnet package list --project NimbusFlow.slnx --vulnerable --include-transitive --no-restore

      - name: Validate Azure infrastructure
        run: |
          az bicep build --file infra/azure/main.bicep --stdout > /dev/null
          az bicep build --file infra/azure/apps.bicep --stdout > /dev/null

      - name: Validate local topology
        env:
          ACCEPT_EULA: N
          MSSQL_SA_PASSWORD: Validation_Only_Password_123!
        run: docker compose config --quiet

  containers:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/NimbusFlow.Api/Dockerfile
          push: false
          tags: nimbusflow-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/NimbusFlow.Worker/Dockerfile
          push: false
          tags: nimbusflow-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
